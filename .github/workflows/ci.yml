name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-tests:
    name: Python app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run app tests
        run: python3 -m unittest discover -s app/tests -v

  terraform-tests:
    name: Terraform fmt / validate / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (local only, no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      # main.tftest.hcl uses mock_provider, so this needs no GCP credentials
      # and makes no calls to Google APIs.
      - name: terraform test
        run: terraform test
